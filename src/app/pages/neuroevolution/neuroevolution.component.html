<section class="neuro">
  <header class="neuro__header">
    <h2 class="neuro__title">Neuroevolución</h2>
    <div class="neuro__actions">
      <button type="button" class="btn btn--primary" (click)="running ? stop() : start()">
        {{ running ? 'Pausar' : 'Entrenar' }}
      </button>
      <button type="button" class="btn" (click)="reset()">Reiniciar</button>
    </div>
  </header>

  <div class="neuro__stats">
    <div class="stat">
      <span class="stat__label">Generación</span>
      <span class="stat__value">{{ stats?.generation ?? '—' }}</span>
    </div>
    <div class="stat">
      <span class="stat__label">Mejor fitness</span>
      <span class="stat__value">
        {{ stats ? (stats.bestFitness | number: '1.3-3') : '—' }}
      </span>
    </div>
    <div class="stat">
      <span class="stat__label">Fitness medio</span>
      <span class="stat__value">
        {{ stats ? (stats.averageFitness | number: '1.3-3') : '—' }}
      </span>
    </div>
  </div>

  <div class="progress" role="progressbar" aria-label="Progreso del mejor individuo"
       [attr.aria-valuenow]="progress | number: '1.0-0'" aria-valuemin="0" aria-valuemax="100">
    <div class="progress__bar" [style.width.%]="progress"></div>
  </div>
</section>
